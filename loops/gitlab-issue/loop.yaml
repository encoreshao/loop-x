# The REAL definition the scheduled GitLab issue loop runs through
# (bin/gitlab_loop_runner.py) - distinct from templates/gitlab-issue/loop.yaml,
# which stays a generic loop-init/audit reference (its pytest/git_diff
# verifiers don't match any real project's actual test_cmd/lint_cmd from
# projects.json). See
# docs/superpowers/specs/2026-09-07-gitlab-loop-runtime-wiring-design.md.
name: gitlab-issue-loop
version: 1

trigger:
  type: schedule
  schedule: "0 10 * * 1-5"

goal:
  type: issue_resolution

agent:
  provider: claude
  model: default

context:
  sources:
    - issue
    - repository
    - project_memory
    - task_memory

actions:
  - inspect_issue
  - inspect_repository
  - modify_code
  - run_tests
  - create_merge_request

# `project_commands` is resolved per issue at runtime: in gate mode it re-runs
# the test/lint commands the agent logged in its fix handoff (falling back to
# the project's stored test_cmd/lint_cmd hints), inside the issue's worktree or,
# for a project with use_worktree: false, its checkout. A logged command outside
# the per-stack allowlist (crates/core/src/verify_commands.rs) is refused, and a
# fix with no test command does not verify. No fix handoff is a vacuous pass.
# mode: gate makes a failure fail the iteration (LoopRuntime retries with the
# failing output as feedback), and the loop, not the agent, pushes and opens
# the merge request only after it passes. mode: observe would record the
# result without enforcing it and let the agent open the MR itself.
verification:
  required: [project_commands]
  mode: gate

verifiers:
  - name: project_commands
    type: project_commands

stop_conditions:
  max_iterations: 2
  # Bounds each issue independently, nested inside the scheduler's outer
  # 43200s (12h) whole-batch sanity timeout (gitlab-loop's timeout_seconds in
  # config/loops.json.template) - which is sized to leave room
  # for a double-digit issue count at this budget plus the end-of-run
  # wrap-up call, and must be raised alongside this value if this ever
  # grows. 30 matches this repo's own LoopDefinition/
  # BudgetController default and templates/gitlab-issue/loop.yaml's value,
  # chosen for that established basis pending real observed run-time data
  # (a project's own bundle install + rspec suite is the dominant cost and
  # has never been measured here).
  max_runtime_minutes: 30
  # Each iteration is one agent call plus the verifier's test_cmd and
  # lint_cmd runs, each bounded by this same value, so the worst-case
  # per-issue ceiling is max_iterations x 3 x this value (6x with the
  # current 2 iterations); in observe mode only one iteration ever runs.
  # max_cost_usd is also enforced inside each Claude call: every agent call
  # gets --max-budget-usd = this value minus what earlier iterations of the
  # same issue already spent (cost.remaining_budget), and a budget-stopped
  # call's spend still counts. Codex calls have no per-call cap and report
  # no cost (ledger total_cost_usd None), so for them the budget is only a
  # between-iterations check on $0.
  max_cost_usd: 3
  no_progress_iterations: 2

human_gates:
  - merge
  - production_deploy

# Retry only ever triggers in gate mode (observe-mode verification always
# passes); the retry carries the failing command output as feedback.
retry:
  enabled: true
  max_attempts: 2

# Setup doctor: when the agent hands off `setup_blocked` (its checks failed on
# a broken environment - missing gems, no database, ... - not on its code), a
# separate agent session repairs the setup, then a second fix pass continues
# the issue. One doctor session per issue per run, capped at
# max_runtime_minutes / max_cost_usd, with at most max_attempts failed repair
# attempts inside it. Its budget sits on top of stop_conditions, not inside
# it. Per-issue worst case is therefore about 85 minutes (30 pass 1 + 25
# doctor + 30 pass 2),
# still well inside the 12h whole-batch timeout (gitlab-loop's
# timeout_seconds in config/loops.json.template, which is plain JSON and
# cannot carry this note itself); raise that timeout if these grow.
setup_doctor:
  enabled: true
  max_attempts: 3
  max_runtime_minutes: 25
  max_cost_usd: 2
